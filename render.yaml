services:
  - type: web
    name: aria-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: static
    name: aria-dashboard
    staticPublishPath: dashboard/build
    buildCommand: cd dashboard && npm install && npm run build